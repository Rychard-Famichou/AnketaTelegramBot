name: Django CI (Linters & Tests)

on:
  push:
    # Исключаем ветку, чтобы при слиянии PR тесты не запускались повторно
    branches-ignore:
#      - develop
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Run Linters
        run: |
          poetry run black --check .
          poetry run isort --check-only .
          poetry run flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgresql_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          TELEGRAM_BOT_TOKEN: 123456789:AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        id: cached-poetry-dependencies
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Run tests
        env:
          SECRET_KEY: "temporary_secret_key_for_testing_purposes"
          POSTGRES_DB: "postgresql_db"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "postgres_password"
          DB_HOST: "127.0.0.1"
          DB_PORT: "5432"
          TELEGRAM_BOT_TOKEN: "123456789:AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQq"
        run: |
          # Включаем строгий режим обработки ошибок в bash
          set -e
          # Запускаем pytest с генерацией отчета покрытия в файл coverage.txt
          poetry run pytest -o addopts="" --cov=. --cov-report=term | tee coverage.txt
          exit ${PIPESTATUS[0]}
          # Выводим отчет в консоль CI, чтобы его было видно в логах коммита
          cat coverage.txt

      - name: Commit and push coverage report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add coverage.txt
          # Если изменений в покрытии нет, шаг завершится успешно без ошибки
          git diff-index --quiet HEAD || (git commit -m "chore: update coverage.txt [skip ci]" && git push)
