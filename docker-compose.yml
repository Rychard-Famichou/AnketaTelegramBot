services:
  db:
    image: postgres:15-alpine
    env_file:
      - .env
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ${DOCKER_HUB_USERNAME}/RF-test-bot:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: .
    command: python tg_bot.py
    restart: always
    env_file:
      - .env
    depends_on:
      - db

  nginx:
    image: ${DOCKER_HUB_USERNAME}/RF-test-bot-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      - web

volumes:
  pg_data:
  static_volume:
