user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name rychard-famichou.com www.rychard-famichou.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name rychard-famichou.com www.rychard-famichou.com;

        # Пути к сертификатам, которые проброшены из ВМ
        ssl_certificate     /etc/letsencrypt/live/rychard-famichou.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rychard-famichou.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /static/ {
            alias /app/static/;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://django_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
