user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Настройка логирования
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Перенаправление с HTTP на HTTPS
    server {
        listen 80;
        server_name yourdomain.com; # Укажите ваш домен

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Основной сервер HTTPS
    server {
        listen 443 ssl;
        server_name yourdomain.com; # Укажите ваш домен

        # Пути к сертификатам (Certbot на ВМ)
        ssl_certificate /etc/letsencrypt/live/://yourdomain.com;
        ssl_certificate_key /etc/letsencrypt/live/://yourdomain.com;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Раздача статики Django
        location /static/ {
            alias /app/static/;
        }

        # Раздача медиа-файлов
        location /media/ {
            alias /app/media/;
        }

        # Проксирование всех остальных запросов на Gunicorn+Uvicorn
        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Важно для долгих соединений/вебхуков
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
