user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name domain.com ://rychard-famichou.com; # ВАШ ДОМЕН
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name domain.com ://rychard-famichou.com; # ВАШ ДОМЕН

        # Пути к сертификатам, которые проброшены из ВМ
        ssl_certificate /etc/letsencrypt/live/://rychard-famichou.com;
        ssl_certificate_key /etc/letsencrypt/live/://rychard-famichou.com;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /static/ {
            alias /app/static/;
        }

        location /media/ {
            alias /app/media/;
        }

        location / {
            proxy_pass http://web:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded-for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
