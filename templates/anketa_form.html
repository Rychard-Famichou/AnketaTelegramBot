<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета кандидата</title>

    {% load static %}
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f8f9fa);
            color: var(--tg-theme-text-color, #212529);
        }

        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border: none;
        }

        .btn-primary {
            background-color: var(--tg-theme-button-color, #0d6efd);
            border-color: var(--tg-theme-button-color, #0d6efd);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
    </style>
</head>
<body>
{% load crispy_forms_tags %}

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-12">
            <div class="card shadow-sm p-4 rounded-3">
                <h2 class="h4 text-center mb-4">Заполнение анкеты</h2>

                <form id="candidateForm" method="POST" action="/api/candidates/" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-3 py-2">
                        Отправить анкету
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

<script>
    document.addEventListener("DOMContentLoaded", async function () {

        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
        const form = document.getElementById('candidateForm');

        // БЛОК ПРЕДЗАПОЛНЕНИЯ ДАННЫХ
        if (user && user.id) {
            try {
                // Делает запрос на /api/candidates/ID_ПОЛЬЗОВАТЕЛЯ/
                const res = await fetch(`/api/candidates/${user.id}/`);
                if (res.ok) {
                    const data = await res.json();

                    // Находим элементы формы по ID, сгенерированным Django Forms + Crispy
                    const firstNameField = document.getElementById('id_first_name');
                    const lastNameField = document.getElementById('id_last_name');
                    const genderField = document.getElementById('id_gender');
                    const phoneField = document.getElementById('id_phone'); // Исправлено под модель (id_phone)

                    // Заполняем поля, если они существуют на странице
                    if (firstNameField) firstNameField.value = data.first_name || '';
                    if (lastNameField) lastNameField.value = data.last_name || '';
                    if (genderField) genderField.value = data.gender || 'Мужской';
                    if (phoneField) phoneField.value = data.phone || '';

                    console.log("Данные анкеты успешно предзаполнены из БД");
                } else if (res.status === 404) {
                    console.log("Кандидат не найден в БД. Это новый пользователь.");
                }
            } catch (err) {
                console.error("Ошибка при получении данных кандидата:", err);
            }
        }


        if (!form) return;

        // БЛОК ОТПРАВКИ ФОРМЫ
        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            e.stopPropagation();

            if (!this.checkValidity()) {
                this.classList.add('was-validated');
                return;
            }

            const formDataInstance = new FormData(this);
            const formData = Object.fromEntries(formDataInstance.entries());

            let telegram_id = null;
            let username = null;

            if (user) {
                telegram_id = Number(user.id);
                username = user.username || null;
            }

            // Добавляем обязательные данные в JSON
            formData.telegram_id = telegram_id ? telegram_id : 123456789;
            formData.username = username ? username : "test_browser_user";

            try {
                const response = await fetch('/api/candidates/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alert('Данные успешно сохранены в БД!');
                    if (tg) tg.close();
                } else {
                    const errors = await response.json();
                    alert('Ошибка валидации от API:\n' + JSON.stringify(errors));
                }
            } catch (error) {
                alert('Сетевая ошибка при отправке на Django: ' + error);
            }
        });
    });
</script>
</body>
</html>
